services:
  # HDFS
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=spark-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_blocksize=2097152   # 2 MB au lieu de 128 MB
    ports:
      - "9870:9870"
      - "9000:9000"

  datanode-1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode-1
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      - namenode

  datanode-2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode-2
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      - namenode

  datanode-3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode-3
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000`
    depends_on:
      - namenode

  #  SPARK 
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      - namenode

  # worker 1 — colocalisé avec datanode-1
  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SPARK_WORKER_HOSTNAME=spark-worker-1
    depends_on:
      - spark-master
      - datanode-1

  # worker 2 — colocalisé avec datanode-2
  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SPARK_WORKER_HOSTNAME=spark-worker-2
    depends_on:
      - spark-master
      - datanode-2

  # worker 3 — colocalisé avec datanode-3
  spark-worker-3:
    image: apache/spark:3.5.0
    container_name: spark-worker-3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SPARK_WORKER_HOSTNAME=spark-worker-3
    depends_on:
      - spark-master
      - datanode-3
      # BASE DE DONNÉES DU METASTORE HIVE
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
      - POSTGRES_DB=metastore_db
    ports:
      - "5432:5432"

  # HIVE METASTORE
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    command: /opt/hive/bin/hive --service metastore
    environment:
      - DB_DRIVER=postgres
      - DB_URL=jdbc:postgresql://postgres:5432/metastore_db
      - DB_USER=hive
      - DB_PASS=hive
    ports:
      - "9083:9083"
    depends_on:
      - postgres
      - namenode

  # HIVESERVER2 (Le point d'accès pour Beeline)
  hive-server2:
    image: apache/hive:4.0.0
    container_name: hive-server2
    command: /opt/hive/bin/hive --service hiveserver2
    environment:
      - HIVE_SERVER2_THRIFT_PORT=10000
      - METASTORE_URIS=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002" # Interface Web pour voir l'état de HiveServer2
    volumes:
      - ./hive/queries:/queries
    depends_on:
      - hive-metastore